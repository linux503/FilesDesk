name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          xcodebuild test \
            -project FilesDesk.xcodeproj \
            -scheme FilesDesk \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGN_IDENTITY=-
